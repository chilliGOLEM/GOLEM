<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Duel Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #34495e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 350px;
            max-height: 90vh;
            overflow-y: auto;
            /* Hide all screens by default, JS handles showing them */
            display: none; 
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #c0392b; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        
        hr { border-color: #7f8c8d; margin: 20px 0; }

        /* Inventory Specifics */
        .creature-card {
            background-color: #2c3e50;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #7f8c8d;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .creature-card:hover { background-color: #1abc9c; color: #2c3e50; }
        
        .crate-section {
            background-color: #f39c12;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #fff;
        }

        /* Modal for Creature Details */
        #details-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ecf0f1;
            color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 100;
            width: 250px;
        }
        /* Dim background when modal is open */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 99;
        }
    </style>
</head>
<body>

    <div class="container" id="lobby-screen">
        <h2>Monster Duel Hub</h2>
        <p>Ready your team for battle.</p>
        <hr>
        <button id="navInventoryBtn" style="background-color: #9b59b6;">My Inventory & Crates</button>
        <button id="battleBtn" style="background-color: #2ecc71;">Enter Arena (Coming Soon)</button>
        <button id="resetSaveBtn" style="background-color: #34495e; border: 1px solid #e74c3c; margin-top: 30px; font-size: 12px;">Reset Save Data</button>
    </div>

    <div class="container" id="inventory-screen">
        <h2>Inventory</h2>
        
        <div class="crate-section">
            <h3 style="margin-top: 0;">Supply Crate</h3>
            <p style="font-size: 14px; margin-bottom: 15px;">Contains a random creature!</p>
            <button id="openCrateBtn">Open Crate!</button>
        </div>

        <h3 style="text-align: left; border-bottom: 1px solid #7f8c8d; padding-bottom: 5px;">My Creatures</h3>
        <div id="creature-list">
            </div>

        <button id="navLobbyBtn" style="background-color: #7f8c8d; margin-top: 20px;">Back to Hub</button>
    </div>

    <div id="modal-overlay"></div>
    <div id="details-modal">
        <h3 id="modalName" style="margin-top:0;">Name</h3>
        <p><strong>Element:</strong> <span id="modalElement"></span></p>
        <p id="modalDesc" style="font-size: 14px; line-height: 1.4;"></p>
        <button id="closeModalBtn" style="background-color: #e74c3c; margin-top: 15px;">Close</button>
    </div>

    <script>
        // ==========================================
        // 1. GAME DATA
        // ==========================================
        const CREATURE_DB = [
            { id: "emberfox", name: "Emberfox", element: "Fire", desc: "A nimble fox with a fiery tail.\n\nAbilities:\n- Scratch\n- Ember\n- Quick Attack" },
            { id: "aquashell", name: "Aquashell", element: "Water", desc: "A sturdy turtle with a hydro-cannon shell.\n\nAbilities:\n- Tackle\n- Water Gun\n- Shell Shield" },
            { id: "leafwing", name: "Leafwing", element: "Grass", desc: "A tiny bird with razor-sharp leaf feathers.\n\nAbilities:\n- Peck\n- Razor Leaf\n- Roost" }
        ];

        const SAVE_KEY = "monsterDuel_saveData";
        let playerData = { unlocked: [], nextCrateTime: 0 };

        // ==========================================
        // 2. UI ELEMENTS & SCREEN MANAGEMENT
        // ==========================================
        const screens = {
            lobby: document.getElementById('lobby-screen'),
            inventory: document.getElementById('inventory-screen')
        };
        const modal = document.getElementById('details-modal');
        const overlay = document.getElementById('modal-overlay');
        const creatureList = document.getElementById('creature-list');
        const openCrateBtn = document.getElementById('openCrateBtn');

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.style.display = 'none');
            screens[screenName].style.display = 'block';
            closeModal();
            if(screenName === 'inventory') renderInventory();
        }

        // ==========================================
        // 3. SAVE / LOAD LOGIC
        // ==========================================
        function loadData() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                playerData = JSON.parse(saved);
            }
            // Start the game in the lobby
            switchScreen('lobby');
        }

        function saveData() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(playerData));
        }

        // Hard reset for testing purposes
        document.getElementById('resetSaveBtn').addEventListener('click', () => {
            if(confirm("Are you sure? This deletes all your creatures!")) {
                localStorage.removeItem(SAVE_KEY);
                playerData = { unlocked: [], nextCrateTime: 0 };
                alert("Save data wiped.");
                switchScreen('lobby');
            }
        });

        // ==========================================
        // 4. INVENTORY LOGIC
        // ==========================================
        function renderInventory() {
            creatureList.innerHTML = ""; 
            if (playerData.unlocked.length === 0) {
                creatureList.innerHTML = "<p style='font-size:14px; color:#bdc3c7; font-style: italic;'>No creatures yet. Open a crate!</p>";
                return;
            }

            playerData.unlocked.forEach(creatureId => {
                const creature = CREATURE_DB.find(c => c.id === creatureId);
                if (creature) {
                    const card = document.createElement('div');
                    card.className = 'creature-card';
                    card.innerText = creature.name;
                    card.onclick = () => showCreatureDetails(creature);
                    creatureList.appendChild(card);
                }
            });
        }

        function showCreatureDetails(creature) {
            document.getElementById('modalName').innerText = creature.name;
            document.getElementById('modalElement').innerText = creature.element;
            // Use innerText to respect the line breaks (\n) in the description
            document.getElementById('modalDesc').innerText = creature.desc; 
            
            overlay.style.display = 'block';
            modal.style.display = 'block';
        }

        function closeModal() {
            overlay.style.display = 'none';
            modal.style.display = 'none';
        }

        document.getElementById('closeModalBtn').onclick = closeModal;
        overlay.onclick = closeModal;

        // ==========================================
        // 5. CRATE TIMER & UNLOCK LOGIC
        // ==========================================
        setInterval(() => {
            const now = Date.now();
            if (now >= playerData.nextCrateTime) {
                openCrateBtn.disabled = false;
                openCrateBtn.innerText = "Open Crate!";
            } else {
                openCrateBtn.disabled = true;
                const remainingSecs = Math.ceil((playerData.nextCrateTime - now) / 1000);
                const mins = Math.floor(remainingSecs / 60);
                const secs = remainingSecs % 60;
                openCrateBtn.innerText = `Wait ${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);

        openCrateBtn.addEventListener('click', () => {
            if (Date.now() < playerData.nextCrateTime) return;

            // Pick a random creature
            const randCreature = CREATURE_DB[Math.floor(Math.random() * CREATURE_DB.length)];
            
            if (playerData.unlocked.includes(randCreature.id)) {
                alert(`You pulled a ${randCreature.name}... but you already have one! (Duplicates do nothing right now)`);
            } else {
                alert(`🎉 Awesome! You unlocked: ${randCreature.name}!`);
                playerData.unlocked.push(randCreature.id);
            }

            // Set next crate time (5 minutes = 300,000 milliseconds)
            playerData.nextCrateTime = Date.now() + (5 * 60 * 1000);
            saveData();
            renderInventory();
        });

        // ==========================================
        // 6. INITIALIZATION & NAVIGATION
        // ==========================================
        document.getElementById('navInventoryBtn').onclick = () => switchScreen('inventory');
        document.getElementById('navLobbyBtn').onclick = () => switchScreen('lobby');

        // Start the game
        loadData();

    </script>
</body>
</html>
