<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Duel Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #34495e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 350px;
            max-height: 90vh;
            overflow-y: auto;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        button {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #c0392b; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        #lobby-screen, #inventory-screen, #loading-screen { display: none; }
        .creature-card {
            background-color: #2c3e50; padding: 10px; margin: 5px 0;
            border-radius: 5px; cursor: pointer; border: 1px solid #7f8c8d;
        }
        .creature-card:hover { background-color: #1abc9c; }
        .crate-section { background-color: #f39c12; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        #details-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background-color: #ecf0f1;
            color: #2c3e50; padding: 20px; border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 100; width: 250px;
        }
    </style>
</head>
<body>

    <div id="loading-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; color:white; padding-top:20vh;">
        <h2>Connecting to Server...</h2>
    </div>

    <div class="container" id="auth-screen">
        <h2>Monster Duel</h2>
        <p id="auth-instruction">Enter credentials to play.</p>
        <input type="text" id="usernameInput" placeholder="username:">
        <input type="password" id="passwordInput" placeholder="password:">
        <button id="enterBtn">ENTER</button>
        <p id="errorMessage" style="color: #ffcccc; font-size: 14px;"></p>
    </div>

    <div class="container" id="lobby-screen">
        <h2>Lobby</h2>
        <p>Welcome, <strong id="usernameDisplay"></strong>!</p>
        <hr style="border-color: #7f8c8d;">
        <button id="navInventoryBtn" style="background-color: #9b59b6;">My Inventory</button>
        <button id="battleBtn" style="background-color: #2ecc71;">Enter Arena (Coming Soon)</button>
        <button id="logoutBtn">Logout</button>
    </div>

    <div class="container" id="inventory-screen">
        <h2>Inventory</h2>
        <div class="crate-section">
            <h3>Supply Crate</h3>
            <button id="openCrateBtn">Open Crate!</button>
        </div>
        <h3>My Creatures</h3>
        <div id="creature-list"></div>
        <button id="navLobbyBtn" style="background-color: #7f8c8d; margin-top: 20px;">Back to Lobby</button>
    </div>

    <div id="details-modal">
        <h3 id="modalName">Name</h3>
        <p><strong>Element:</strong> <span id="modalElement"></span></p>
        <p id="modalDesc" style="font-size: 14px;"></p>
        <button id="closeModalBtn" style="background-color: #e74c3c;">Close</button>
    </div>

    <script>
        // ==========================================
        // 1. CLOUD DATABASE SETUP (JSONBin.io)
        // ==========================================
        const JSONBIN_URL = "https://api.jsonbin.io/v3/b/YOUR_BIN_ID"; 
        const JSONBIN_KEY = "YOUR_API_KEY"; 

        // ==========================================
        // 2. GAME DATA
        // ==========================================
        const CREATURE_DB = [
            { id: "emberfox", name: "Emberfox", element: "Fire", desc: "Abilities: Scratch, Ember, Quick Attack." },
            { id: "aquashell", name: "Aquashell", element: "Water", desc: "Abilities: Tackle, Water Gun, Shell Shield." },
            { id: "leafwing", name: "Leafwing", element: "Grass", desc: "Abilities: Peck, Razor Leaf, Roost." }
        ];

        let currentUserStr = "";
        let playerData = { unlocked: [], nextCrateTime: 0 };
        let cloudDatabase = {}; // Stores all users from the cloud

        const screens = {
            auth: document.getElementById('auth-screen'),
            lobby: document.getElementById('lobby-screen'),
            inventory: document.getElementById('inventory-screen'),
            loading: document.getElementById('loading-screen')
        };
        const errorMessage = document.getElementById('errorMessage');
        const lockedUser = localStorage.getItem('locked_browser_user');

        // ==========================================
        // 3. CLOUD SYNC FUNCTIONS
        // ==========================================
        async function fetchCloudData() {
            screens.loading.style.display = 'block';
            try {
                const req = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_KEY }
                });
                const res = await req.json();
                cloudDatabase = res.record;
            } catch (err) {
                errorMessage.innerText = "Failed to connect to server.";
            }
            screens.loading.style.display = 'none';
        }

        async function updateCloudData() {
            screens.loading.style.display = 'block';
            await fetch(JSONBIN_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
                body: JSON.stringify(cloudDatabase)
            });
            screens.loading.style.display = 'none';
        }

        // ==========================================
        // 4. AUTH & LOCK LOGIC
        // ==========================================
        if (lockedUser) {
            document.getElementById('usernameInput').value = lockedUser;
            document.getElementById('usernameInput').style.display = 'none';
            document.getElementById('auth-instruction').innerText = `Locked to: ${lockedUser}`;
        }

        document.getElementById('enterBtn').addEventListener('click', async () => {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value;

            if (!user || !pass) return errorMessage.innerText = "Enter all fields.";

            await fetchCloudData(); // Get latest accounts from cloud

            // Check if user exists in cloud
            if (cloudDatabase[user]) {
                if (cloudDatabase[user].password !== pass) {
                    return errorMessage.innerText = "Wrong password.";
                }
                // Check Lock
                if (lockedUser && lockedUser !== user) {
                    return errorMessage.innerText = "This browser is locked to another account.";
                }
            } else {
                // User doesn't exist. Create them if browser isn't locked to someone else
                if (lockedUser && lockedUser !== user) {
                    return errorMessage.innerText = "This browser is locked. You cannot create a new account here.";
                }
                // Create new account in cloud
                cloudDatabase[user] = {
                    password: pass,
                    data: { unlocked: [], nextCrateTime: 0 }
                };
                await updateCloudData();
            }

            // Lock this browser permanently to this user
            if (!lockedUser) localStorage.setItem('locked_browser_user', user);

            // Log them in
            currentUserStr = user;
            playerData = cloudDatabase[user].data;
            document.getElementById('usernameDisplay').innerText = user;
            renderInventory();
            switchScreen('lobby');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentUserStr = "";
            document.getElementById('passwordInput').value = "";
            switchScreen('auth');
        });

        // ==========================================
        // 5. INVENTORY & CRATE LOGIC
        // ==========================================
        async function savePlayerProgress() {
            cloudDatabase[currentUserStr].data = playerData;
            await updateCloudData(); // Saves to cloud so you can see it on your phone
        }

        function renderInventory() {
            const list = document.getElementById('creature-list');
            list.innerHTML = "";
            if (playerData.unlocked.length === 0) {
                list.innerHTML = "<p>No creatures yet.</p>"; return;
            }
            playerData.unlocked.forEach(id => {
                const c = CREATURE_DB.find(x => x.id === id);
                if (c) {
                    const div = document.createElement('div');
                    div.className = 'creature-card';
                    div.innerText = c.name;
                    div.onclick = () => {
                        document.getElementById('modalName').innerText = c.name;
                        document.getElementById('modalElement').innerText = c.element;
                        document.getElementById('modalDesc').innerText = c.desc;
                        document.getElementById('details-modal').style.display = 'block';
                    };
                    list.appendChild(div);
                }
            });
        }

        document.getElementById('closeModalBtn').onclick = () => document.getElementById('details-modal').style.display = 'none';

        const openBtn = document.getElementById('openCrateBtn');
        setInterval(() => {
            if (!currentUserStr) return;
            const now = Date.now();
            if (now >= playerData.nextCrateTime) {
                openBtn.disabled = false; openBtn.innerText = "Open Crate!";
            } else {
                openBtn.disabled = true;
                const secs = Math.ceil((playerData.nextCrateTime - now) / 1000);
                openBtn.innerText = `Wait ${Math.floor(secs / 60)}:${(secs % 60).toString().padStart(2, '0')}`;
            }
        }, 1000);

        openBtn.addEventListener('click', async () => {
            if (Date.now() < playerData.nextCrateTime) return;
            const rand = CREATURE_DB[Math.floor(Math.random() * CREATURE_DB.length)];
            
            if (!playerData.unlocked.includes(rand.id)) {
                playerData.unlocked.push(rand.id);
                alert(`Unlocked ${rand.name}!`);
            } else {
                alert(`Duplicate ${rand.name}. Nothing happens.`);
            }

            playerData.nextCrateTime = Date.now() + (5 * 60 * 1000);
            renderInventory();
            await savePlayerProgress(); // Sync to cloud
        });

        // ==========================================
        // 6. NAVIGATION
        // ==========================================
        function switchScreen(name) {
            Object.values(screens).forEach(s => s.style.display = 'none');
            screens[name].style.display = 'block';
            document.getElementById('details-modal').style.display = 'none';
        }
        document.getElementById('navInventoryBtn').onclick = () => switchScreen('inventory');
        document.getElementById('navLobbyBtn').onclick = () => switchScreen('lobby');
        switchScreen('auth');

    </script>
</body>
</html>
