<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Duel Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #34495e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 350px;
            max-height: 90vh;
            overflow-y: auto;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        button {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #c0392b;
        }
        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        /* Screens */
        #lobby-screen, #inventory-screen {
            display: none;
        }
        /* Inventory Specifics */
        .creature-card {
            background-color: #2c3e50;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #7f8c8d;
        }
        .creature-card:hover {
            background-color: #1abc9c;
        }
        .crate-section {
            background-color: #f39c12;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #fff;
        }
        /* Modal for Creature Details */
        #details-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ecf0f1;
            color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            z-index: 100;
            width: 250px;
        }
    </style>
</head>
<body>

    <div class="container" id="auth-screen">
        <h2>Monster Duel</h2>
        <input type="text" id="usernameInput" placeholder="Enter your username">
        <input type="password" id="passwordInput" placeholder="Enter your password">
        <button id="loginBtn">Login</button>
        <button id="registerBtn" style="background-color: #3498db;">Register</button>
        <p id="errorMessage" style="color: #ffcccc; font-size: 14px;"></p>
    </div>

    <div class="container" id="lobby-screen">
        <h2>Lobby</h2>
        <p>Welcome, <strong id="usernameDisplay"></strong>!</p>
        <hr style="border-color: #7f8c8d;">
        <button id="navInventoryBtn" style="background-color: #9b59b6;">My Inventory & Crates</button>
        <button id="battleBtn" style="background-color: #2ecc71;">Enter Arena (Coming Soon)</button>
        <button id="logoutBtn">Logout</button>
    </div>

    <div class="container" id="inventory-screen">
        <h2>Inventory</h2>
        
        <div class="crate-section">
            <h3>Supply Crate</h3>
            <p style="font-size: 12px;">Contains a random creature!</p>
            <button id="openCrateBtn">Open Crate!</button>
        </div>

        <h3>My Creatures</h3>
        <div id="creature-list">
            </div>

        <button id="navLobbyBtn" style="background-color: #7f8c8d; margin-top: 20px;">Back to Lobby</button>
    </div>

    <div id="details-modal">
        <h3 id="modalName">Name</h3>
        <p><strong>Element:</strong> <span id="modalElement"></span></p>
        <p id="modalDesc" style="font-size: 14px;">Description goes here.</p>
        <button id="closeModalBtn" style="background-color: #e74c3c;">Close</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- GAME DATA ---
        const CREATURE_DB = [
            { id: "emberfox", name: "Emberfox", element: "Fire", desc: "A nimble fox with a fiery tail. Abilities: Scratch, Ember, Quick Attack." },
            { id: "aquashell", name: "Aquashell", element: "Water", desc: "A sturdy turtle with a hydro-cannon shell. Abilities: Tackle, Water Gun, Shell Shield." },
            { id: "leafwing", name: "Leafwing", element: "Grass", desc: "A tiny bird with razor-sharp leaf feathers. Abilities: Peck, Razor Leaf, Roost." }
        ];

        let currentUserStr = "";
        let playerData = { unlocked: [], nextCrateTime: 0 };

        // --- UI ELEMENTS ---
        const screens = {
            auth: document.getElementById('auth-screen'),
            lobby: document.getElementById('lobby-screen'),
            inventory: document.getElementById('inventory-screen')
        };
        const openCrateBtn = document.getElementById('openCrateBtn');
        const creatureList = document.getElementById('creature-list');
        const detailsModal = document.getElementById('details-modal');

        // --- GAME LOGIC ---

        // Load & Save Data to Browser LocalStorage
        function loadPlayerData() {
            const saved = localStorage.getItem(`duelData_${currentUserStr}`);
            if (saved) {
                playerData = JSON.parse(saved);
            } else {
                playerData = { unlocked: [], nextCrateTime: 0 };
            }
            renderInventory();
        }

        function savePlayerData() {
            localStorage.setItem(`duelData_${currentUserStr}`, JSON.stringify(playerData));
        }

        // Render Inventory List
        function renderInventory() {
            creatureList.innerHTML = ""; // clear current list
            if (playerData.unlocked.length === 0) {
                creatureList.innerHTML = "<p style='font-size:14px; color:#bdc3c7;'>You have no creatures yet. Open a crate!</p>";
                return;
            }

            playerData.unlocked.forEach(creatureId => {
                const creature = CREATURE_DB.find(c => c.id === creatureId);
                if (creature) {
                    const card = document.createElement('div');
                    card.className = 'creature-card';
                    card.innerText = creature.name;
                    card.onclick = () => showCreatureDetails(creature);
                    creatureList.appendChild(card);
                }
            });
        }

        // Show/Hide Details Modal
        function showCreatureDetails(creature) {
            document.getElementById('modalName').innerText = creature.name;
            document.getElementById('modalElement').innerText = creature.element;
            document.getElementById('modalDesc').innerText = creature.desc;
            detailsModal.style.display = 'block';
        }
        document.getElementById('closeModalBtn').onclick = () => detailsModal.style.display = 'none';

        // Crate Timer Loop (Runs every 1 second)
        setInterval(() => {
            if (!currentUserStr) return; // Not logged in
            const now = Date.now();
            
            if (now >= playerData.nextCrateTime) {
                openCrateBtn.disabled = false;
                openCrateBtn.innerText = "Open Crate!";
            } else {
                openCrateBtn.disabled = true;
                const remainingSecs = Math.ceil((playerData.nextCrateTime - now) / 1000);
                const mins = Math.floor(remainingSecs / 60);
                const secs = remainingSecs % 60;
                openCrateBtn.innerText = `Ready in ${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);

        // Open Crate Action
        openCrateBtn.addEventListener('click', () => {
            if (Date.now() < playerData.nextCrateTime) return;

            // Pick random creature
            const randomCreature = CREATURE_DB[Math.floor(Math.random() * CREATURE_DB.length)];
            
            if (playerData.unlocked.includes(randomCreature.id)) {
                alert(`You opened the crate and got... ${randomCreature.name}! But it's a duplicate. Nothing happens.`);
            } else {
                alert(`Awesome! You unlocked a new creature: ${randomCreature.name}!`);
                playerData.unlocked.push(randomCreature.id);
            }

            // Set next crate time (5 minutes from now)
            playerData.nextCrateTime = Date.now() + (5 * 60 * 1000);
            savePlayerData();
            renderInventory();
        });


        // --- NAVIGATION & AUTH LOGIC ---
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.style.display = 'none');
            screens[screenName].style.display = 'block';
            detailsModal.style.display = 'none'; // Ensure modal closes on screen change
        }

        document.getElementById('navInventoryBtn').onclick = () => switchScreen('inventory');
        document.getElementById('navLobbyBtn').onclick = () => switchScreen('lobby');

        const getFakeEmail = (user) => `${user.replace(/\s+/g, '').toLowerCase()}@monsterduel.local`;

        document.getElementById('registerBtn').onclick = () => {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;
            if(!user) return;
            createUserWithEmailAndPassword(auth, getFakeEmail(user), pass)
                .catch(err => document.getElementById('errorMessage').innerText = err.message);
        };

        document.getElementById('loginBtn').onclick = () => {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;
            if(!user) return;
            signInWithEmailAndPassword(auth, getFakeEmail(user), pass)
                .catch(err => document.getElementById('errorMessage').innerText = "Invalid login.");
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserStr = user.email.split('@')[0];
                document.getElementById('usernameDisplay').innerText = currentUserStr;
                loadPlayerData(); // Load their inventory when they log in
                switchScreen('lobby');
            } else {
                currentUserStr = "";
                switchScreen('auth');
            }
        });
    </script>
</body>
</html>
